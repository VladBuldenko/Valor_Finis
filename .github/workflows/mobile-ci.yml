name: Mobile CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only token: this workflow only checks code. It builds nothing, publishes
# nothing and uses no EAS, signing, Supabase or other secrets.
permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-checks:
    name: Mobile typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
